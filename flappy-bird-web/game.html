<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird MK64 - Online Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        #game-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
        
        #canvas-container {
            background: #4a9eff;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 10px 40px rgba(74, 158, 255, 0.3);
        }
        
        #game-canvas {
            display: none;
            border-radius: 4px;
            background: skyblue;
        }
        
        .screen {
            padding: 20px;
        }
        
        h1 {
            font-size: 64px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48cae0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 2s ease-in-out infinite;
        }
        
        @keyframes rainbow {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
        }
        
        .powerup-icon {
            font-size: 48px;
            display: inline-block;
            margin: 5px;
            padding: 10px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        
        .powerup-icon:hover {
            transform: scale(1.2);
        }
        
        input[type="text"] {
            padding: 12px 16px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            width: 300px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            transform: translateY(0);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        
        #connect-btn {
            background: linear-gradient(45deg, #feca57, #ff6b6b);
            color: white;
        }
        
        #start-btn {
            background: linear-gradient(45deg, #48cae0, #42c0fd);
            color: white;
        }
        
        #play-btn {
            background: linear-gradient(45deg, #4cc9f0, #3a7bd5);
            color: white;
        }
        
        /* Power-up styling */

    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container">
            <h1>🐦 Flappy Bird MK64 🏎️</h1>
            <p style="font-size: 20px; margin-bottom: 30px;">Online Multiplayer with Power-Ups!</p>
            
            <div class="screen player-selection" id="player-selection">
                <h2>Pick a Player Color</h2>
                <p style="margin-top: 20px;">Choose your avatar color for the multiplayer race!</p>
                <br>
                <div id="color-options"></div>
            </div>
            
            <button id="connect-btn" style="display: none;">Connect to Server</button>
            
            <div id="lobby-container" style="display: none;">
                <h2>🎮 Game Lobby 🎮</h2>
                <div id="player-list" style="text-align: left; margin-bottom: 20px;"></div>
                
                <br><br>
                <p>Your Power-Ups:</p>
                <div id="player-powerups"></div>
            </div>
            
            <button id="start-btn" style="display: none;" onclick="startGame()">Start Game</button>
            
            <div id="game-screen" style="display: none;">
                <canvas id="game-canvas" width="800" height="600"></canvas>
                <br><br>
                <div class="screen">
                    <h2 id="powerup-counter"></h2>
                    <button id="play-btn" onclick="pauseGame()">Pause Game</button>
                    <br><br>
                    <button onclick="showPlayerSelection()">Exit to Menu</button>
                </div>
            </div>
            
            <button id="play-btn" style="display: none;" onclick="startGame()">Enter Game</button>
            
            <div id="gameover-screen" style="display: none;">
                <h2>💀 Game Over! 💀</h2>
                <p id="final-score">Score: </p>
                <br>
                <button onclick="showPlayerSelection()">Back to Menu</button>
            </div>
        </div>
    </div>
    
    <audio id="jump-sound" src="https://assets.mixkit.co/sfx/mixkit-retro-jump-3049.mp3"></audio>
    <audio id="powerup-sound" src="https://assets.mixkit.co/sfx/mixkit-successful-action-1065.mp3"></audio>
    <audio id="death-sound" src="https://assets.mixkit.co/sfx/mixkit-retro-game-game-over-569.mp3"></audio>
</body>
</html>
