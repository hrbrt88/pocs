<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Controls -->
        <div id="controls" style="position:absolute;top:20px;left:50%;right:50%;">
            <button id="jump-btn" style="padding:10px 30px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;">JUMP</button>
        </div>
        
        <!-- Start Screen -->
        <div id="start-screen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.5);color:white;">
            <h1 style="font-size:48px;margin-bottom:20px;">Flappy Bird</h1>
            <p style="font-size:20px;">Press SPACE or click JUMP to start!</p>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);color:white;">
            <h1 style="font-size:48px;margin-bottom:20px;">Game Over!</h1>
            <p id="final-score" style="font-size:36px;">Final Score: 0</p>
            <button id="restart-btn" style="margin-top:20px;padding:12px 40px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;">Play Again</button>
        </div>
    </div>
    
    <script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');

        // Game state variables
        let gameState = 'start'; // start, playing, gameover, paused
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappyHighScore')) || 0;

        // Bird physics
        let birdX = 100;
        let birdY = 200;
        let birdVelocity = 0;
        const gravity = 0.5;
        const lift = -8;
        let pipes = [];
        let pipeTimer = 0;
        let frameCount = 0;

       // Canvas size stored for use in game logic
       let canvasWidth = canvas.width; 
       let canvasHeight = canvas.height;

        function init() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
        }

    function resetGame() { birdX = 100; birdY = 200; birdVelocity = 0; pipes = [];
        score = 0; localStorage.removeItem('flappyHighScore'); highScore = 0;
        pipeTimer = 0; frameCount = 0; }

    function generateLevel() { // Generate the game level
const gap = canvasHeight * 0.25; // Adjust gap based on screen size
let topPipeHeight = Math.random() > 0.5 ? canvasHeight - gap : 50; 

if (Math.random() > 0.4) {
    pipes.push({ x: canvasWidth, gap: gap });
}

        function updateGame() {
            if (gameState !== 'playing') {
                requestAnimationFrame(updateGame);
         return; }
